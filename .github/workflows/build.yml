name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # 每个平台在自己的 runner 上构建：libsql 原生模块按宿主平台安装，无法交叉打包
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 内置价格快照；拉取失败时沿用仓库里的快照
      - run: node scripts/prices.mjs || echo "prices snapshot skipped"
        shell: bash
        working-directory: apps/desktop
      # 版本号取自 tag（v1.2.3 → 1.2.3），手动触发时沿用 apps/desktop/package.json
      - name: 版本号
        shell: bash
        working-directory: apps/desktop
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; else echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"; fi
          grep -Eq '^VERSION=[0-9]+\.[0-9]+\.[0-9]+' "$GITHUB_ENV" || { echo "::error::版本号为空或格式不对"; exit 1; }
      # macOS 用固定的自签证书签名：自动更新要求新旧版本签名身份一致（ADR-005）。证书只注入 macOS 构建
      - name: 导入 macOS 签名证书
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$MAC_CERT_P12" ]; then echo "::error::缺少 Secrets MAC_CERT_P12 / MAC_CERT_PASSWORD，见 README“发布”一节"; exit 1; fi
          echo "$MAC_CERT_P12" | base64 --decode > cert.p12
          openssl pkcs12 -in cert.p12 -clcerts -nokeys -passin env:MAC_CERT_PASSWORD -legacy -out cert.pem 2>/dev/null || openssl pkcs12 -in cert.p12 -clcerts -nokeys -passin env:MAC_CERT_PASSWORD -out cert.pem
          security create-keychain -p ci build.keychain
          security set-keychain-settings build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          # 自签证书需设为代码签名受信任，electron-builder 才会把它列为有效身份
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k build.keychain cert.pem
          security find-identity -v -p codesigning build.keychain | grep 'River Self Signed'
          rm cert.p12
      - name: 打包
        shell: bash
        working-directory: apps/desktop
        run: |
          pnpm build
          if [ "$RUNNER_OS" = macOS ]; then
            pnpm exec electron-builder --publish never -c.extraMetadata.version=$VERSION -c.mac.identity="River Self Signed" -c.mac.forceCodeSigning=true
          else
            pnpm exec electron-builder --publish never -c.extraMetadata.version=$VERSION
          fi
      - name: 断言 macOS 签名身份
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: codesign -dvvv dist/mac-arm64/River.app 2>&1 | grep 'Authority=River Self Signed'
      - uses: actions/upload-artifact@v4
        with:
          name: river-${{ runner.os }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest*.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # 正式发布（不是草稿）：electron-updater 看不到草稿
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          make_latest: true
