appId: app.river.desktop
productName: River
directories:
  buildResources: build
files:
  - out/**
  - package.json
# libsql 为 N-API 原生模块，.node 无法从 asar 内加载
asarUnpack:
  - node_modules/@libsql/**
  - node_modules/libsql/**
mac:
  target:
    - target: dmg
      arch: arm64
  # 不签名（null）会留下残缺的链接器签名，带下载隔离标记时 macOS 直接判为“已损坏”；ad-hoc 签名则走可放行的“未验证开发者”流程
  identity: '-'
  # hardened runtime 只在公证时需要；ad-hoc 签名下开启它会让库校验拦下 libsql 的 .node
  hardenedRuntime: false
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: x64
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
linux:
  target:
    - target: AppImage
      arch: x64
  category: Game
  artifactName: ${productName}-${version}-${arch}.${ext}
npmRebuild: false
